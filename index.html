<style>
html,body{height:100%}
body{overflow:hidden}
.stage{position:relative;width:100vw;height:100svh;overflow:hidden}
/* ⚠️ fx.js 등장 애니가 .wrap 에 transform 을 남기면 .wrap 이 absolute 자식의 기준 박스가 된다.
   .wrap 은 높이 0이라 bottom:% 가 0으로 계산돼 하단 요소가 화면 위로 사라진다.
   → .wrap 자체를 스테이지 크기로 고정해 기준 박스를 명확히 한다. */
.stage > .wrap{position:absolute;inset:0;z-index:5}
.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:67% 48%;
  filter:saturate(.78) brightness(.66) contrast(1.08);transform:scale(1.02)}
body.day .stage-bg{filter:saturate(1.02) brightness(1.02) contrast(1.02);object-position:52% 40%}
.stage-shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(6,4,9,.94) 0,rgba(6,4,9,.58) 36%,transparent 66%),
  linear-gradient(0deg,rgba(6,4,9,.82),transparent 46%),
  linear-gradient(135deg,rgba(142,69,177,.24),transparent 52%)}
body.day .stage-shade{background:
  linear-gradient(90deg,rgba(247,243,248,.92) 0,rgba(247,243,248,.55) 38%,transparent 68%),
  linear-gradient(0deg,rgba(247,243,248,.82),transparent 46%),
  linear-gradient(135deg,rgba(157,119,166,.20),transparent 52%)}

/* 상단바를 사진 위에 얹기 (플로팅 아님 — 화면 상단에 붙은 헤어라인 바) */
.stage .topbar{position:absolute;top:0;left:0;right:0;background:linear-gradient(180deg,rgba(6,4,9,.72),rgba(6,4,9,.12));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20}
body.day .stage .topbar{background:linear-gradient(180deg,rgba(251,248,252,.80),rgba(251,248,252,.16))}

.hero{position:absolute;top:clamp(96px,15vh,168px);left:var(--pad);z-index:6}
.hero .bio,.hero .meta{max-width:min(620px,54vw)}
.hero .out{white-space:nowrap;font-family:var(--ff-disp);font-size:clamp(64px,12.4vw,232px);font-weight:900;line-height:.8;letter-spacing:-.085em;
  color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(222,185,239,.72);
  filter:drop-shadow(0 0 2px rgba(197,119,232,.42)) drop-shadow(0 0 8px rgba(164,77,207,.18))}
body.day .hero .out{-webkit-text-stroke:1px rgba(80,49,93,.66);filter:none}
.hero .line{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:9px;font-weight:900;letter-spacing:.24em;color:var(--main)}
.hero .line i{display:block;width:38px;height:1px;background:var(--main)}
.hero .bio{margin:12px 0 0;font-family:var(--ff-serif);font-size:clamp(15px,1.5vw,24px);color:var(--ink);letter-spacing:-.01em}
.hero .meta{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hero .meta div{border-left:1px solid var(--line);padding-left:12px}
.hero .meta span{display:block;font-size:8.5px;font-weight:900;letter-spacing:.2em;color:var(--main)}
.hero .meta b{font-family:var(--ff-serif);font-weight:500;font-size:clamp(15px,1.5vw,23px);color:var(--ink)}

.log{position:absolute;bottom:5%;left:var(--pad);z-index:8;width:min(56%,720px);
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:clamp(112px,15.5vh,168px);
  border:1px solid var(--line);background:rgba(8,5,12,.44);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
body.day .log{background:rgba(255,255,255,.52)}
.log > small{position:absolute;bottom:calc(100% + 11px);left:0;color:var(--main);font-size:9px;font-weight:900;letter-spacing:.2em}
.log > div{position:relative;display:grid;grid-template-rows:auto 1fr auto auto;align-items:center;min-width:0;
  padding:clamp(9px,1.1vw,20px);border-right:1px solid var(--line-soft);font-size:9px}
.log > div:last-child{border-right:0}
.log > div.on{background:linear-gradient(180deg,rgba(202,153,223,.20),transparent)}
.log .n{color:var(--ink-dim);font-size:8.5px}
.log b{align-self:end;font-size:clamp(9px,.62vw,12px);letter-spacing:.08em}
.log strong{color:var(--main-light);font-size:clamp(9px,.78vw,14px);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
body.day .log strong{color:var(--main-deep)}
.log em{margin-top:3px;color:var(--ink-soft);font-family:var(--ff-serif);font-size:clamp(9px,.55vw,11px);font-style:normal}

.bcast{position:absolute;right:var(--pad);bottom:6%;z-index:8;width:min(30%,360px);
  border-top:1px solid var(--main-light);border-bottom:1px solid var(--line);
  background:rgba(8,5,12,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:15px 17px}
body.day .bcast{background:rgba(255,255,255,.56)}
.bcast .row{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.bcast .av{width:46px;height:46px;border:1px solid var(--line);background-size:cover;background-position:center;cursor:pointer;flex:0 0 auto}
.bcast .k{color:var(--main);font-size:8.5px;font-weight:900;letter-spacing:.18em}
.bcast .t{font-family:var(--ff-serif);font-size:clamp(14px,1.3vw,25px);font-weight:500;line-height:1.2;margin-top:2px}
.bcast p{margin:9px 0 0;color:var(--ink-soft);font-size:11px;line-height:1.6}

.rail{position:absolute;top:clamp(88px,13vh,150px);right:calc(var(--pad) - 14px);z-index:8;
  display:flex;flex-direction:column;align-items:flex-end;gap:18px}
.rail a,.rail span{font-size:8.5px;font-weight:800;letter-spacing:.16em;writing-mode:vertical-rl;color:var(--ink-soft);transition:color .18s}
.rail a:hover{color:var(--main-light)}
body.day .rail a:hover{color:var(--main-deep)}
.rail span{margin-top:6px;color:var(--ink-dim)}

@media (max-width:1080px){
  .stage .topbar .col{height:58px}
  .hero{top:clamp(84px,13vh,120px);right:var(--pad)}
  .hero .bio,.hero .meta{max-width:none}
  .hero .out{font-size:clamp(56px,17vw,120px)}
  .log{left:var(--pad);right:var(--pad);width:auto;bottom:4%;height:clamp(112px,19vh,150px)}
  .log > div{padding:8px 4px;text-align:center}
  .bcast{right:var(--pad);left:var(--pad);width:auto;bottom:calc(4% + clamp(112px,19vh,150px) + 22px)}
  .rail{display:none}
}
@media (max-width:560px){
  .hero .meta{gap:14px}
  .log strong{font-size:8px}
}
</style>
</head>
<body>

<script>

var DAYS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
var DAYKO = ['월','화','수','목','금','토','일'];

/* 요일 한 칸 = "라벨|시간" (예: CHAT|21:00). 비우면 휴방(REST).
   week-0~6 이 하나도 없으면 예전 방식(days 체크 + 공통 시간)으로 자동 폴백한다. */
function dayCell(p, i){
  var raw = txt(p['week-' + i] || '');
  if (raw){
    var q = raw.split('|');
    var label = (q[0] || '').trim();
    var when  = (q[1] || '').trim();
    if (!label) return { on:false, label:'REST', time:'—' };
    return { on:true, label:label.toUpperCase(), time: when || '—' };
  }
  return null;
}
function renderLog(p){
  var set = String(txt(p.days) || '').split(',').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
  var time = txt(p['main-time']) || '17:00';
  var free = set.length === 0;
  var useWeek = false;
  for (var w=0;w<7;w++){ if (txt(p['week-' + w] || '')) { useWeek = true; break; } }

  var host = document.getElementById('logGrid');
  var html = '<small>WEEKLY TRANSMISSION</small>';
  var onCount = 0;
  for (var i=0;i<7;i++){
    /* 요일별 편성을 쓰는 중이면 빈 칸 = 휴방. 체크박스 방식으로 되돌아가면 안 된다. */
    var c = useWeek ? (dayCell(p, i) || { on:false, label:'REST', time:'—' }) : null;
    if (!c){
      var on = free || set.indexOf(String(i)) >= 0;
      c = { on:on, label: on ? 'ON AIR' : 'REST', time: on ? time : '—' };
    }
    if (c.on) onCount++;
    html += '<div class="' + (c.on ? 'on' : '') + '">'
      + '<span class="n">' + ('0'+(i+1)) + '</span>'
      + '<b>' + DAYS[i] + '</b>'
      + '<strong>' + esc(c.label) + '</strong>'
      + '<em>' + esc(c.time) + '</em>'
      + '</div>';
  }
  host.innerHTML = html;
  var cap = document.getElementById('logCap');
  if (!cap) return;
  if (useWeek){
    cap.textContent = onCount === 7 ? '매일 점등' : ('주 ' + onCount + '회 점등');
  } else {
    cap.textContent = free ? '요일 고정 없음 · 보통 오후 ' + (parseInt(time,10)>12? (parseInt(time,10)-12):5) + '시 전후 점등'
                           : '점등 요일 ' + set.map(function(d){return DAYKO[+d];}).join('·');
  }
}

function nextTransmission(p){
  var set = String(txt(p.days) || '').split(',').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
  var time = txt(p['main-time']) || '17:00';
  var now = new Date();
  var todayIdx = (now.getDay() + 6) % 7; // 0=월

  /* 요일별 편성(week-0~6)이 있으면 그걸 우선해서 다음 방송을 찾는다 */
  var hasWeek = false;
  for (var w=0;w<7;w++){ if (txt(p['week-' + w] || '')) { hasWeek = true; break; } }
  if (hasWeek){
    for (var k=0;k<8;k++){
      var ix = (todayIdx + k) % 7;
      var c = dayCell(p, ix);
      if (c && c.on) return { d: DAYKO[ix], t: c.time, note: k===0 ? '오늘 밤' : (k===1 ? '내일' : k + '일 뒤') };
    }
    return { d: '—', t: '—', note: '' };
  }

  if (set.length === 0) return { d: DAYKO[todayIdx], t: time, note: '요일 고정 없이 열려요' };
  for (var i=0;i<8;i++){
    var idx = (todayIdx + i) % 7;
    if (set.indexOf(String(idx)) >= 0) return { d: DAYKO[idx], t: time, note: i===0 ? '오늘 밤' : (i===1 ? '내일' : i + '일 뒤') };
  }
  return { d: '—', t: '—', note: '' };
}

function boot(){
  bootSite();
  getProfile().then(function(raw){
    var p = mergeP(raw);
    /* 메인 히어로 사진 — 없으면 밤 배경, 그것도 없으면 기본 파일 유지 */
    var photo = txt(p['main-photo']) || txt(p['bg-night']);
    if (photo){
      var sb = document.getElementById('stageBg');
      sb.referrerPolicy = 'no-referrer';
      sb.onerror = function(){ this.src = 'assets/nancho-purple-night.webp'; this.onerror = null; };
      sb.src = photo;
    }
    document.getElementById('avTile').style.backgroundImage = 'url("' + avatarUrl(p) + '")';

    renderLog(p);
    var nt = nextTransmission(p);
    document.getElementById('nextD').textContent = nt.d + '요일 · ' + nt.t + ' KST';
    var story = txt(p['main-story']) || '게임과 이야기 사이, 밤의 주파수를 맞춰요.';
    document.getElementById('nextN').textContent = nt.note ? (nt.note + ' — ' + story) : story;

    ['soop','youtube','cafe','melo'].forEach(function(k){
      var a = document.getElementById('lk-' + k);
      var v = txt(p['link-' + k]) || '';
      if (!a) return;
      if (v) a.href = v; else a.style.display = 'none';
    });
    ready();
  });
}
boot();

</script>
