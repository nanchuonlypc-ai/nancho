<style>
html,body{height:100%}
/* The stage carries the cover photo. style.css also paints the photo on body,
   which would show through the letterbox bands, so flatten it here.
   place-content centres the stage so the band splits evenly top and bottom. */
/* Anchor the stage to the top. Leftover height goes below it, never above. */
body,body.day{overflow:hidden;background-image:none;background-color:var(--bg);
  min-height:100svh;display:flex;align-items:flex-start;justify-content:center}
/* SOOP embeds give the iframe an arbitrary height. Sizing the cover with vh
   makes it stretch and background-size:cover then blows the photo up.
   Lock the ratio with aspect-ratio and size everything from the container width
   (cqw) instead: design basis 1600x900, so design px / 16 = cqw. */
.stage{position:relative;width:min(100%, calc(100svh * 16 / 9));margin:0 auto;
  aspect-ratio:16/9;overflow:hidden;container-type:inline-size}

/* fx.js leaves a transform on .wrap, which makes it the containing block
   for absolute children. Give it a real box or bottom:% collapses to 0.
   Width is capped to the same value sub-pages use so the composition does not
   spread apart on wide screens. Centering uses margin:auto, not transform. */
.stage > .wrap{position:absolute;inset:0;z-index:5}
.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:67% 48%;
  filter:saturate(.75) brightness(.67) contrast(1.08);transform:scale(1.02)}
body.day .stage-bg{filter:saturate(1.02) brightness(1.02) contrast(1.02);object-position:52% 40%}
.stage-shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(6,4,9,.92) 0,rgba(6,4,9,.58) 35%,transparent 64%),
  linear-gradient(0deg,rgba(6,4,9,.77),transparent 44%),
  linear-gradient(135deg,rgba(142,69,177,.23),transparent 50%)}
body.day .stage-shade{background:
  linear-gradient(90deg,rgba(247,243,248,.92) 0,rgba(247,243,248,.55) 38%,transparent 68%),
  linear-gradient(0deg,rgba(247,243,248,.82),transparent 46%),
  linear-gradient(135deg,rgba(157,119,166,.20),transparent 52%)}

/* The hairline spans the full width, the row inside is capped to the same
   width as the content below so the logo lines up with it. */
.stage .topbar{position:absolute;top:0;left:0;right:0;z-index:20;height:9%;
  border-bottom:1px solid rgba(255,255,255,.30);background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.stage .topbar > .tbrow{height:100%;padding:0 3.5%;
  box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
body.day .stage .topbar{border-bottom-color:rgba(28,16,36,.24)}
.stage .topbar .brand{display:flex;align-items:baseline;gap:7px;width:max-content;line-height:1}
.stage .topbar .brand .ko{font-family:var(--ff-serif);font-size:calc(1.5cqw * var(--fs-title));font-weight:700;letter-spacing:-.1em}
.stage .topbar .brand .en{font-size:calc(0.45cqw * var(--fs-label));font-weight:900;letter-spacing:.27em}
.tb-center{justify-self:center;font-size:calc(0.46cqw * var(--fs-label));font-weight:700;letter-spacing:.18em;color:var(--ink)}
.tb-right{justify-self:end;display:flex;align-items:center;gap:1.05cqw}

.tb-nav{display:flex;align-items:center;gap:1.05cqw}
.tb-nav a{color:var(--ink);text-decoration:none;font-size:calc(0.46cqw * var(--fs-label));
  font-weight:700;letter-spacing:.18em;white-space:nowrap;transition:color .18s;opacity:.86}
.tb-nav a:hover,.tb-nav a.on{color:var(--main-light);opacity:1}
body.day .tb-nav a:hover,body.day .tb-nav a.on{color:var(--main-deep)}
.tb-right .sep{width:1px;height:11px;background:rgba(255,255,255,.28)}
body.day .tb-right .sep{background:rgba(28,16,36,.26)}
.tb-right .tbtn{border:1px solid rgba(255,255,255,.34);padding:5px 10px;line-height:1}
body.day .tb-right .tbtn{border-color:rgba(28,16,36,.3)}
.tb-right .tbtn.solid{background:var(--main-deep);border-color:var(--main-deep);color:#fff}
#sheetOpen{display:none}
@media (max-width:1080px){
  .tb-nav{display:none}
  #sheetOpen{display:inline-block}
}
.tb-right button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit;
  font-size:calc(0.46cqw * var(--fs-label));font-weight:700;letter-spacing:.18em;transition:color .18s}
.tb-right button:hover{color:var(--main-light)}
body.day .tb-right button:hover{color:var(--main-deep)}

.hero{position:absolute;top:29%;left:4%;z-index:1;pointer-events:none}
.hero .out{white-space:nowrap;font-family:var(--ff-disp);font-size:calc(13cqw * var(--fs-display));font-weight:950;
  line-height:.8;letter-spacing:-.09em;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:1px rgba(222,185,239,.66);user-select:none;
  filter:drop-shadow(0 0 2px rgba(197,119,232,.44)) drop-shadow(0 0 7px rgba(164,77,207,.20))}
body.day .hero .out{-webkit-text-stroke:1px rgba(80,49,93,.66);filter:none}

.log{position:absolute;bottom:5%;left:4%;z-index:3;width:56%;
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:8.438cqw;
  border:1px solid rgba(255,255,255,.29);background:rgba(8,5,12,.42);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
body.day .log{border-color:rgba(28,16,36,.22);background:rgba(255,255,255,.52)}
.log > small{position:absolute;bottom:calc(100% + 11px);left:0;color:#C999DF;
  font-size:calc(0.43cqw * var(--fs-label));font-weight:900;letter-spacing:.17em}
body.day .log > small{color:var(--main-deep)}
.log > div{position:relative;display:grid;grid-template-rows:auto 1fr auto auto;align-items:center;min-width:0;
  padding:1.2cqw;border-right:1px solid rgba(255,255,255,.18);font-size:calc(0.48cqw * var(--fs-label))}
body.day .log > div{border-right-color:rgba(28,16,36,.16)}
.log > div:last-child{border-right:0}
.log > div.on{background:linear-gradient(180deg,rgba(202,153,223,.18),transparent)}
.log .n{color:rgba(255,255,255,.38)}
body.day .log .n{color:rgba(28,16,36,.42)}
.log b{align-self:end;font-size:calc(0.62cqw * var(--fs-body));letter-spacing:.08em}
.log strong{color:#D7B1E8;font-size:calc(0.78cqw * var(--fs-body));letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis}
body.day .log strong{color:var(--main-deep)}
.log em{margin-top:4px;color:rgba(255,255,255,.72);font-family:var(--ff-serif);
  font-size:calc(0.55cqw * var(--fs-label));font-style:normal}
body.day .log em{color:rgba(28,16,36,.72)}

.bcast{position:absolute;right:4%;bottom:6%;z-index:3;width:29%;padding:14px 16px;
  display:grid;grid-template-columns:8px 1fr;gap:2px 9px;
  border-top:1px solid #D6A8EA;border-bottom:1px solid rgba(255,255,255,.38);
  background:rgba(8,5,12,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.day .bcast{border-bottom-color:rgba(28,16,36,.30);background:rgba(255,255,255,.56)}
.bcast .dot{grid-row:1/3;width:8px;height:8px;margin-top:5px;border-radius:50%;
  background:#D89DFA;box-shadow:0 0 13px #D89DFA}
.bcast .k{color:#C9A3DC;font-size:calc(0.43cqw * var(--fs-label));font-weight:900;letter-spacing:.16em}
body.day .bcast .k{color:var(--main-deep)}
.bcast .t{font-family:var(--ff-serif);font-size:calc(1.28cqw * var(--fs-title));font-weight:500}
.bcast p{grid-column:2;margin:6px 0 0;color:rgba(255,255,255,.66);font-size:calc(0.52cqw * var(--fs-label))}
body.day .bcast p{color:rgba(28,16,36,.70)}

.rail{position:absolute;top:14%;right:2.3%;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:18px}
.rail a,.rail span{font-size:calc(0.43cqw * var(--fs-label));font-weight:800;letter-spacing:.14em;
  writing-mode:vertical-rl;color:var(--ink);transition:color .18s}
.rail a:hover{color:var(--main-light)}
body.day .rail a:hover{color:var(--main-deep)}
.rail span{margin-top:8px;color:rgba(255,255,255,.40)}
body.day .rail span{color:rgba(28,16,36,.45)}

.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(6,4,9,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6.188cqw 6% 2.812cqw}
body.day .sheet{background:rgba(247,243,248,.95)}
.sheet.on{display:grid;align-content:center;gap:2px;overflow-y:auto;overscroll-behavior:contain}

.sheet a{display:block;padding:0.506cqw 0;font-family:var(--ff-disp);
  font-size:calc(min(4.2cqw,2.475cqw) * var(--fs-display));font-weight:900;letter-spacing:-.03em;color:var(--ink);
  border-bottom:1px solid var(--line);transition:color .16s,padding-left .16s}
.sheet a:hover{color:var(--main-light);padding-left:14px}
body.day .sheet a:hover{color:var(--main-deep)}
.sheet a small{display:inline-block;margin-left:12px;font-family:var(--ff-body);
  font-size:calc(0.625cqw * var(--fs-label));font-weight:900;letter-spacing:.2em;color:var(--main);vertical-align:middle}
.sheet .tools{display:flex;gap:10px;margin-top:1.238cqw}
.sheet .tools button{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;
  font-size:calc(0.625cqw * var(--fs-label));font-weight:900;letter-spacing:.18em;padding:11px 18px;cursor:pointer}
.sheet .tools button:hover{border-color:var(--main)}
.sheet .x{position:absolute;top:0;right:6%;height:9%;display:flex;align-items:center;
  background:none;border:0;color:var(--ink);font:inherit;font-size:calc(0.6875cqw * var(--fs-label));font-weight:900;letter-spacing:.18em;cursor:pointer}

/* Under 960px the fixed ratio would squeeze everything, so release it and
   let the blocks stack in normal flow. Sizes go back to px here. */
@media (max-width:959px){
  .stage{aspect-ratio:auto;height:auto;min-height:100svh;container-type:normal}
  .stage-bg{position:absolute;inset:0;height:100%}
  .stage > .wrap{position:static;max-width:none;display:flex;flex-direction:column;
    gap:20px;padding:calc(64px + 18px) 5% 26px}
  .hero,.log,.bcast{position:static;width:auto}
  .hero{pointer-events:auto}
  .hero .out{font-size:calc(19vw * var(--fs-display))}
  .log{height:auto;grid-template-columns:repeat(4,minmax(0,1fr))}
  .log > div{padding:10px 6px;text-align:center}
  .log .n{font-size:calc(9px * var(--fs-label))}
  .log b,.log strong{font-size:calc(11px * var(--fs-label))}
  .log em{font-size:calc(10px * var(--fs-label))}
  .log small{grid-column:1/-1}
  .bcast{padding:14px 16px}
  .rail{display:none}
  .stage .topbar{height:auto}
  .stage .topbar > .tbrow{height:58px;padding:0 5%}
  .stage .topbar .brand .ko{font-size:calc(20px * var(--fs-title))}
  .stage .topbar .brand .en{font-size:calc(7px * var(--fs-label))}
  .tb-center{display:none}
  .tb-right button{font-size:calc(9px * var(--fs-label))}
}

@media (max-width:700px){
  .stage .topbar{height:7%}
  .stage .topbar > .tbrow{padding:0 4%}
  .tb-center{display:none}
  .hero{top:18%;left:4%}
  .hero .out{font-size:calc(20cqw * var(--fs-display))}
  .log{right:4%;left:4%;bottom:4%;width:auto;height:11.25cqw}
  .log > div{padding:8px 4px;text-align:center}
  .log .n{font-size:calc(0.3125cqw * var(--fs-label))}
  .log b,.log strong{font-size:calc(0.4375cqw * var(--fs-label))}
  .log em{font-size:calc(0.375cqw * var(--fs-label))}
  .bcast{top:12%;right:4%;bottom:auto;width:48%;padding:10px 11px}
  .rail{top:29%;right:4%}
}
</style>

<script>

var DAYS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
var DAYKO = ['월','화','수','목','금','토','일'];

function dayCell(p, i){
  var raw = txt(p['week-' + i] || '');
  if (raw){
    var q = raw.split('|');
    var label = (q[0] || '').trim();
    var when  = (q[1] || '').trim();
    if (!label) return { on:false, label:'REST', time:'—' };
    return { on:true, label:label.toUpperCase(), time: when || '—' };
  }
  return null;
}
function renderLog(p, liveIdx){
  var set = String(txt(p.days) || '').split(',').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
  var time = txt(p['main-time']) || '17:00';
  var free = set.length === 0;
  var useWeek = false;
  for (var w=0;w<7;w++){ if (txt(p['week-' + w] || '')) { useWeek = true; break; } }

  var host = document.getElementById('logGrid');
  var html = '<small>WEEKLY TRANSMISSION</small>';
  var onCount = 0;
  for (var i=0;i<7;i++){
    
    var c = useWeek ? (dayCell(p, i) || { on:false, label:'REST', time:'—' }) : null;
    if (!c){
      var on = free || set.indexOf(String(i)) >= 0;
      c = { on:on, label: on ? 'ON AIR' : 'REST', time: on ? time : '—' };
    }
    if (c.on) onCount++;
    
    html += '<div class="' + (i === liveIdx ? 'on' : '') + '">'
      + '<span class="n">' + ('0'+(i+1)) + '</span>'
      + '<b>' + DAYS[i] + '</b>'
      + '<strong>' + esc(c.label) + '</strong>'
      + '<em>' + esc(c.time) + '</em>'
      + '</div>';
  }
  host.innerHTML = html;
  var cap = document.getElementById('logCap');
  if (!cap) return;
  if (useWeek){
    cap.textContent = onCount === 7 ? '매일 점등' : ('주 ' + onCount + '회 점등');
  } else {
    cap.textContent = free ? '요일 고정 없음 · 보통 오후 ' + (parseInt(time,10)>12? (parseInt(time,10)-12):5) + '시 전후 점등'
                           : '점등 요일 ' + set.map(function(d){return DAYKO[+d];}).join('·');
  }
}

function nextTransmission(p){
  var set = String(txt(p.days) || '').split(',').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
  var time = txt(p['main-time']) || '17:00';
  var now = new Date();
  var todayIdx = (now.getDay() + 6) % 7; // 0=월

  
  var hasWeek = false;
  for (var w=0;w<7;w++){ if (txt(p['week-' + w] || '')) { hasWeek = true; break; } }
  if (hasWeek){
    for (var k=0;k<8;k++){
      var ix = (todayIdx + k) % 7;
      var c = dayCell(p, ix);
      if (c && c.on) return { d: DAYS[ix], t: c.time, idx: ix, note: k===0 ? '오늘 밤' : (k===1 ? '내일' : k + '일 뒤') };
    }
    return { d: '—', t: '—', idx: -1, note: '' };
  }

  if (set.length === 0) return { d: DAYS[todayIdx], t: time, idx: todayIdx, note: '요일 고정 없이 열려요' };
  for (var i=0;i<8;i++){
    var idx = (todayIdx + i) % 7;
    if (set.indexOf(String(idx)) >= 0) return { d: DAYS[idx], t: time, idx: idx, note: i===0 ? '오늘 밤' : (i===1 ? '내일' : i + '일 뒤') };
  }
  return { d: '—', t: '—', idx: -1, note: '' };
}

function boot(){
  bootSite();
  getProfile().then(function(raw){
    var p = mergeP(raw);
    
    var photo = txt(p['main-photo']) || txt(p['bg-night']);
    if (photo){
      var sb = document.getElementById('stageBg');
      sb.referrerPolicy = 'no-referrer';
      sb.onerror = function(){ this.src = 'assets/nancho-purple-night.webp'; this.onerror = null; };
      sb.src = photo;
    }
    var nt = nextTransmission(p);
    renderLog(p, nt.idx);
    document.getElementById('nextD').textContent = nt.d + ' · ' + nt.t + ' KST';
    
    document.getElementById('nextN').textContent = txt(p['main-story']) || '게임과 이야기 사이, 밤의 주파수를 맞춰요.';

    ['soop','youtube','x'].forEach(function(k){
      var a = document.getElementById('lk-' + k);
      var v = txt(p['link-' + k]) || '';
      if (!a) return;
      if (v) a.href = v; else a.style.display = 'none';
    });
    ready();
  });
}

(function(){
  var sh = document.getElementById('sheet');
  function open(){ sh.classList.add('on'); document.body.style.overflow = 'hidden'; }
  function close(){ sh.classList.remove('on'); }
  document.getElementById('sheetOpen').addEventListener('click', open);
  document.getElementById('sheetClose').addEventListener('click', close);
  sh.addEventListener('click', function(e){ if (e.target === sh) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  
  sh.querySelector('[data-ask]').addEventListener('click', close);
})();

boot();

</script>
