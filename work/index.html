<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:description" content="NANCHO official.">

<link rel="stylesheet" href="../style.css">
<style>

.wksum{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);margin-bottom:18px}
.wksum span{flex:1 1 0;min-width:140px;padding:16px 18px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px}
.wksum span:last-child{border-right:0}
.wksum b{font-family:var(--ff-serif);font-size:calc(26px * var(--fs-title));line-height:1}
.wksum b.hi{color:var(--main)}

.wksearch{max-width:320px;margin-bottom:20px}

.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  border-left:1px solid var(--line);border-top:1px solid var(--line)}
.wkcard{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:22px 14px 20px;text-align:center;cursor:pointer;background:none;
  transition:background .18s;position:relative}
.wkcard:hover{background:rgba(199,155,216,.09)}
body.day .wkcard:hover{background:rgba(110,74,130,.08)}
.wkcard .no{position:absolute;top:8px;left:10px;font-family:var(--ff-serif);
  font-size:calc(10px * var(--fs-label));color:var(--ink-dim)}
.wkav,.wkfb{width:58px;height:58px;margin:0 auto 12px;display:block;object-fit:cover;
  border:1px solid var(--line);background:rgba(255,255,255,.05)}
.wkfb{display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);
  font-size:calc(22px * var(--fs-title));color:var(--main-light)}
body.day .wkfb{color:var(--main-deep)}
.wknick{font-size:calc(13.5px * var(--fs-body));font-weight:700;line-height:1.3;word-break:break-all}
.wkid{font-size:calc(10.5px * var(--fs-label));color:var(--ink-dim);margin:3px 0 10px;letter-spacing:.04em}
.wktot{display:inline-block;border:1px solid var(--main);color:var(--main-light);
  font-size:calc(10.5px * var(--fs-label));font-weight:900;letter-spacing:.12em;padding:4px 11px}
body.day .wktot{color:var(--main-deep)}
.wktot.zero{border-color:var(--line);color:var(--ink-dim)}

.wkmodal{max-width:420px;width:100%}
.wkmtop{display:flex;align-items:center;gap:14px;padding-bottom:16px;
  border-bottom:1px solid var(--line);margin-bottom:4px}
.wkmtop .wkav,.wkmtop .wkfb{margin:0;width:50px;height:50px;flex:0 0 auto}
.wkmtop .n{font-size:calc(17px * var(--fs-title));font-weight:800;letter-spacing:-.01em}
.wkmtop .i{font-size:calc(11px * var(--fs-label));color:var(--ink-dim);margin-top:2px}
.wkrow{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px dashed var(--line);font-size:calc(13.5px * var(--fs-body))}
.wkrow:last-child{border-bottom:0}
.wkrow .nm{flex:1;font-weight:700}
.wkrow .ev{font-size:calc(9px * var(--fs-label));font-weight:900;letter-spacing:.16em;border:1px solid var(--main);
  color:var(--main-light);padding:2px 7px}
body.day .wkrow .ev{color:var(--main-deep)}
.wkrow .ct{font-family:var(--ff-serif);color:var(--main);font-size:calc(15px * var(--fs-body))}
.wkmemo{font-size:calc(11px * var(--fs-label));color:var(--ink-dim);margin-top:3px;font-weight:400}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('theme')==='light')document.body.classList.add('day');}catch(e){}</script>
<div class="grain" aria-hidden="true"></div>

  <div class="col">
    <a class="brand" href="../" aria-label="난초 메인">
      <span class="ko" data-name>난초</span><span class="en">NANCHO</span>
    </a>
    <nav class="menu" id="menu">
        <a href="../index.html" data-t="nav-1">메인</a>

        <a href="../notice/" data-t="nav-3">공지</a>
        <a href="../schedule/" data-t="nav-4">일정</a>
        <a href="../work/" class="on" data-t="nav-5">업보</a>
        <a href="../diary/" data-t="nav-6">일기</a>
        <a href="../song/" data-t="nav-7">노래책</a>
        <a href="../dress/" data-t="nav-8">옷장</a>

    </nav>
    <div class="tools">
      <button class="tbtn mobtn" id="moBtn" aria-label="메뉴">≡</button>
      <button class="tbtn" data-mode>DAY</button>

</header>
<main class="wrap">
<section class="filehead">
  <div class="fh-ghost" aria-hidden="true">LEDGER</div>
  <div class="col">
    <div class="fh-kicker"><i></i><span>FILE 04 · KARMA</span></div>
    <h1 class="fh-title">업보 <em>KARMA</em></h1>
    <p class="fh-sub" data-sub="work">방송에서 쌓인 것들은 사라지지 않고 장부에 남습니다. 오늘도 성실히 적립 중.</p>

<section class="panel">

    <div class="sec-head">
      <div><div class="sec-no">LEDGER</div><h2 class="sec-title"><small>KARMA LIST</small><span data-t="t-work-1">업보 장부</span></h2></div>
      <div class="sec-note" id="updDate"></div>
    </div>

    <div class="wksum">
      <span><i class="lbl">기록된 초단</i><b id="sumV">0</b></span>
      <span><i class="lbl">업보 종류</i><b id="sumT">0</b></span>
      <span><i class="lbl">누적 총합</i><b id="sumC" class="hi">0</b></span>

    <input class="input wksearch" id="q" type="text" placeholder="닉네임 · 아이디 검색">

    <div class="wkgrid" id="grid"><div class="loading">RECEIVING…</div></div>

  </div>
</footer>
<div class="mask" id="wkMask" role="dialog" aria-modal="true" aria-label="업보 상세">
  <div class="modal wkmodal">
    <button class="x" data-wkclose aria-label="닫기">✕</button>
    <div id="wkBody"></div>
  </div>
</div>

<div class="mask" id="askMask" role="dialog" aria-modal="true" aria-label="문의">
  <div class="modal">
    <div class="modal-h">
      <div><small>TRANSMIT</small><b>난초에게 전파 보내기</b></div>
      <button class="x" data-close aria-label="닫기">×</button>
    </div>
    <div class="modal-b">
      <label class="field"><span>닉네임 (선택)</span>
        <input class="input" id="askNick" type="text" placeholder="초단 아무개" maxlength="30">
      </label>
      <label class="field"><span>내용</span>
        <textarea class="input" id="askMsg" placeholder="문의·제보·응원 무엇이든 좋아요." maxlength="1200"></textarea>
        <em class="hint">보낸 내용은 난초만 볼 수 있어요. 답이 필요하면 연락 수단도 함께 적어주세요.</em>
      </label>
      <button class="btn solid" id="askSend" style="width:100%">전파 전송</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script src="../site.js"></script>
<script>

(function(){
  var V = [], T = [], C = {}, Q = '';

  function soopAvatar(id){
    if (!id) return null;
    id = String(id).trim().toLowerCase();
    if (id.length < 2) return null;
    return 'https://profile.img.sooplive.co.kr/LOGO/' + id.slice(0,2) + '/' + id + '/' + id + '.jpg';
  }
  function avatarHTML(v, cls){
    var url = soopAvatar(v.soop_id);
    var ini = esc(String(v.nickname || '?').charAt(0));
    if (!url) return '<div class="wkfb ' + (cls||'') + '">' + ini + '</div>';
    return '<img class="wkav ' + (cls||'') + '" src="' + url + '" alt="" referrerpolicy="no-referrer"'
         + ' onerror="this.outerHTML=\'<div class=&quot;wkfb&quot;>' + ini + '</div>\'">';
  }
  function totalOf(vid){
    var n = 0;
    T.forEach(function(t){ n += (C[vid + ':' + t.id] || 0); });
    return n;
  }

  function render(){
    var q = Q.trim().toLowerCase();
    var list = V.filter(function(v){
      if (!q) return true;
      return String(v.nickname || '').toLowerCase().indexOf(q) >= 0
          || String(v.soop_id  || '').toLowerCase().indexOf(q) >= 0;
    });
    var grid = document.getElementById('grid'), emp = document.getElementById('wkEmpty');
    if (!list.length){
      grid.innerHTML = '';
      emp.style.display = '';
      emp.innerHTML = V.length ? '<b>NO MATCH</b>검색 결과가 없어요'
                               : '<b>NO RECORD</b>아직 기록된 초단이 없어요';
      return;
    }
    emp.style.display = 'none';
    grid.innerHTML = list.map(function(v, i){
      var tot = totalOf(v.id);
      return '<div class="wkcard" data-v="' + v.id + '">'
        + '<span class="no">' + ('0' + (i+1)).slice(-2) + '</span>'
        + avatarHTML(v)
        + '<div class="wknick">' + esc(v.nickname) + '</div>'
        + '<div class="wkid">' + (v.soop_id ? esc(v.soop_id) : '&nbsp;') + '</div>'
        + '<span class="wktot' + (tot ? '' : ' zero') + '">업보 ' + tot + '</span>'
        + '</div>';
    }).join('');
  }

  function openViewer(vid){
    var v = null;
    for (var i=0;i<V.length;i++) if (String(V[i].id) === String(vid)) v = V[i];
    if (!v) return;
    var rows = T.filter(function(t){ return (C[v.id + ':' + t.id] || 0) > 0; }).map(function(t){
      return '<div class="wkrow"><span class="nm">' + esc(t.name) + '</span>'
        + (t.category === '이벤트' ? '<span class="ev">EVENT</span>' : '')
        + '<span class="ct">×' + C[v.id + ':' + t.id] + '</span></div>';
    }).join('');
    document.getElementById('wkBody').innerHTML =
      '<div class="wkmtop">' + avatarHTML(v)
      + '<div><div class="n">' + esc(v.nickname) + '</div>'
      + (v.soop_id ? '<div class="i">' + esc(v.soop_id) + '</div>' : '')
      + (v.memo ? '<div class="wkmemo">' + esc(v.memo) + '</div>' : '')
      + '</div></div>'
      + (rows || '<div class="empty" style="border:0;padding:26px 0"><b>CLEAN</b>아직 쌓인 업보가 없어요</div>');
    document.getElementById('wkMask').classList.add('on');
  }

  function boot(){
    Promise.all([
      typeof fetchAll === 'function' ? fetchAll('viewers',     { order:'sort_order', asc:true }) : [],
      typeof fetchAll === 'function' ? fetchAll('upbo_types',  { order:'sort_order', asc:true }) : [],
      typeof fetchAll === 'function' ? fetchAll('upbo_counts', { order:'id',         asc:true }) : []
    ]).then(function(r){
      V = r[0] || []; T = r[1] || [];
      var counts = r[2] || [], latest = '';
      counts.forEach(function(c){
        C[c.viewer_id + ':' + c.type_id] = c.count || 0;
        if (c.updated_at && c.updated_at > latest) latest = c.updated_at;
      });
      var total = 0;
      Object.keys(C).forEach(function(k){ total += C[k]; });
      document.getElementById('sumV').textContent = V.length;
      document.getElementById('sumT').textContent = T.length;
      document.getElementById('sumC').textContent = total.toLocaleString();
      document.getElementById('updDate').textContent = latest ? '갱신 ' + latest.slice(0,10) : '';
      render();
    }).catch(function(){ render(); }).then(function(){ if (typeof ready === 'function') ready(); });
  }

  document.addEventListener('click', function(e){
    var c = e.target.closest && e.target.closest('.wkcard');
    if (c) openViewer(c.dataset.v);
    var m = document.getElementById('wkMask');
    if (m && (e.target === m || (e.target.closest && e.target.closest('[data-wkclose]')))) m.classList.remove('on');
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ var m = document.getElementById('wkMask'); if (m) m.classList.remove('on'); }
  });
  var qi = document.getElementById('q');
  if (qi) qi.addEventListener('input', function(){ Q = this.value; render(); });

  if (typeof bootSite === 'function') bootSite();
  boot();
})();
</script>
</body>
</html>
